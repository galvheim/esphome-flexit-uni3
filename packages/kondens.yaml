# ============================================================
# KONDENS – valgfri: duggpunkt inne i aggregatet
# ============================================================
# Med en temperatur- og fuktsensor inne i aggregatet (f.eks. ved
# uteluftfilteret) regnes duggpunktet ut, og hvor mange grader lufta er
# over det. Nær 0 betyr kondens på filter og metall.
# Bare visning i HA – styrer ingenting.
#
# Trenger temperatur og fukt fra en sensor i aggregatet i HA
# (f.eks. en BME280 på en egen ESP eller en Zigbee-sensor).
# ============================================================

substitutions:
  aggregat_temp_entitet: sensor.aggregat_temperatur
  aggregat_fukt_entitet: sensor.aggregat_luftfuktighet

sensor:
  - platform: homeassistant
    id: aggregat_temperatur
    entity_id: ${aggregat_temp_entitet}
  - platform: homeassistant
    id: aggregat_fukt
    entity_id: ${aggregat_fukt_entitet}

  # Duggpunkt (Magnus-formelen)
  - platform: template
    id: duggpunkt
    name: "Duggpunkt i aggregat"
    update_interval: 60s
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      float t = id(aggregat_temperatur).state;
      float rh = id(aggregat_fukt).state;
      if (isnan(t) || isnan(rh) || rh <= 0) return NAN;
      float g = logf(rh / 100.0f) + 17.62f * t / (243.12f + t);
      return 243.12f * g / (17.62f - g);

  - platform: template
    id: duggpunktsmargin
    name: "Duggpunktsmargin"
    update_interval: 60s
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      return id(aggregat_temperatur).state - id(duggpunkt).state;
